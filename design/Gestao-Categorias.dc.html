<html lang="pt-BR">
<head>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A9482C}a:hover{color:#8A3920}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #FBFAF6; color: #292621; font-family: 'Inter', system-ui, sans-serif; font-size: 16px; line-height: 24px">
<header style="display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 6px; flex: none; background: #FFFFFF; border-bottom: 1px solid #E4DCCB"><a href="Gestao-Produtos.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; border-radius: 12px; color: #292621; display: inline-flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M15 5l-7 7 7 7"></path></svg></a><div style="flex: 1 1 0; font-family: 'Bricolage Grotesque', 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 20px; line-height: 26px">Categorias</div></header><main style="display: flex; flex-direction: column; gap: 16px; padding: 16px 16px 24px"><div style="padding: 4px 16px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E4DCCB; padding-top: 0; padding-bottom: 0"><div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 0; border-bottom: 1px solid #E4DCCB"><span style="flex: 1 1 0; min-width: 0"><b>Queijos e laticínios</b><span style="display: block; font-size: 13px; line-height: 18px; color: #5E584E; font-variant-numeric: tabular-nums">6 produtos</span></span><span style="padding: 4px 10px; border-radius: 8px; background: #E3EDE6; color: #315C46; font-size: 13px; line-height: 18px; font-weight: 600; white-space: nowrap">Na loja</span></div><div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 0; border-bottom: 1px solid #E4DCCB"><span style="flex: 1 1 0; min-width: 0"><b>Carnes e embutidos</b><span style="display: block; font-size: 13px; line-height: 18px; color: #5E584E; font-variant-numeric: tabular-nums">5 produtos</span></span><span style="padding: 4px 10px; border-radius: 8px; background: #E3EDE6; color: #315C46; font-size: 13px; line-height: 18px; font-weight: 600; white-space: nowrap">Na loja</span></div><div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 0; border-bottom: 1px solid #E4DCCB"><span style="flex: 1 1 0; min-width: 0"><b>Farinhas e grãos</b><span style="display: block; font-size: 13px; line-height: 18px; color: #5E584E; font-variant-numeric: tabular-nums">8 produtos</span></span><span style="padding: 4px 10px; border-radius: 8px; background: #E3EDE6; color: #315C46; font-size: 13px; line-height: 18px; font-weight: 600; white-space: nowrap">Na loja</span></div><div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 0; border-bottom: 1px solid #E4DCCB"><span style="flex: 1 1 0; min-width: 0"><b>Doces</b><span style="display: block; font-size: 13px; line-height: 18px; color: #5E584E; font-variant-numeric: tabular-nums">5 produtos</span></span><span style="padding: 4px 10px; border-radius: 8px; background: #E3EDE6; color: #315C46; font-size: 13px; line-height: 18px; font-weight: 600; white-space: nowrap">Na loja</span></div><div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 0; border-bottom: 1px solid #E4DCCB"><span style="flex: 1 1 0; min-width: 0"><b>Temperos e conservas</b><span style="display: block; font-size: 13px; line-height: 18px; color: #5E584E; font-variant-numeric: tabular-nums">7 produtos</span></span><span style="padding: 4px 10px; border-radius: 8px; background: #E3EDE6; color: #315C46; font-size: 13px; line-height: 18px; font-weight: 600; white-space: nowrap">Na loja</span></div><div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 0; border-bottom: 1px solid #E4DCCB"><span style="flex: 1 1 0; min-width: 0"><b>Bebidas</b><span style="display: block; font-size: 13px; line-height: 18px; color: #5E584E; font-variant-numeric: tabular-nums">4 produtos</span></span><span style="padding: 4px 10px; border-radius: 8px; background: #E3EDE6; color: #315C46; font-size: 13px; line-height: 18px; font-weight: 600; white-space: nowrap">Na loja</span></div><sc-for list="{{ novas }}" as="c" hint-placeholder-count="0"><div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 0; border-bottom: 1px solid #E4DCCB"><span style="flex: 1 1 0; min-width: 0"><b>{{ c.nome }}</b><span style="display: block; font-size: 13px; line-height: 18px; color: #5E584E">0 produtos</span></span><span style="padding: 4px 10px; border-radius: 8px; background: #DDE8EF; color: #2F5D7C; font-size: 13px; line-height: 18px; font-weight: 600; white-space: nowrap">Nova</span></div></sc-for></div><div style="display: flex; gap: 8px; align-items: flex-end"><div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 6px"><label for="nc" style="font-size: 14px; line-height: 20px; font-weight: 600">Nova categoria</label><input id="nc" type="text" placeholder="Ex.: Castanhas" value="{{ txt }}" onChange="{{ onTxt }}" style="height: 48px; padding: 0 14px; border-radius: 8px; border: 1.5px solid #E4DCCB; background: #FFFFFF; color: #292621; font: 400 16px 'Inter', system-ui, sans-serif; box-sizing: border-box; width: 100%"></div><button type="button" onClick="{{ add }}" style="flex: none; height: 48px; padding: 0 18px; border: 0; border-radius: 12px; background: #A9482C; color: #FFFFFF; font: 600 16px 'Inter', system-ui, sans-serif">Adicionar</button></div><div style="font-size: 14px; line-height: 20px; color: #5E584E">A ordem aqui é a ordem dos atalhos na loja online.</div></main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const novas = st.novas || [];
const txt = st.txt || '';
return { novas: novas, txt: txt, onTxt: (e) => this.setState({ txt: e.target.value }), add: () => { const n = (txt || '').trim(); if (n) this.setState({ novas: novas.concat([{ nome: n }]), txt: '' }); } };
}
}
</script>
</body>
</html>
