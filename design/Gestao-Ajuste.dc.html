" type="radio" name="tipo" style="flex: none; width: 22px; height: 22px; accent-color: #A9482C; margin: 0"><span style="flex: 1 1 0; min-width: 0"><span style="display: block; font-weight: 600">Consumo interno</span><span style="display: block; font-size: 13px; line-height: 18px; color: #5E584E">Usado na casa, degustação</span></span></label><label for="tp3" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 10px 14px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E4DCCB"><input id="tp3" type="radio" name="tipo" style="flex: none; width: 22px; height: 22px; accent-color: #A9482C; margin: 0"><span style="flex: 1 1 0; min-width: 0"><span style="display: block; font-weight: 600">Correção de contagem</span><span style="display: block; font-size: 13px; line-height: 18px; color: #5E584E">O sistema estava errado</span></span></label></fieldset><div style="display: flex; flex-direction: column; gap: 6px"><label for="lote" style="font-size: 14px; line-height: 20px; font-weight: 600">Lote</label><select id="lote" style="height: 48px; padding: 0 12px; border-radius: 8px; border: 1.5px solid #E4DCCB; background: #FFFFFF; color: #292621; font: 400 16px 'Inter', system-ui, sans-serif"><option>QC-1107 · vence 19/11 · 8 un</option><option>QC-1112 · vence 02/12 · 10 un</option></select></div><div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E4DCCB"><span style="font-weight: 600">Quantidade que saiu</span><div role="group" aria-label="Quantidade" style="display: inline-flex; align-items: center; gap: 2px"><button type="button" aria-label="Diminuir" onClick="{{ menos }}" style="flex: none; width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E4DCCB; background: #F7F2E8; color: #292621; display: inline-flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M5 12h14"></path></svg></button><div aria-live="polite" style="min-width: 36px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums">{{ q }}</div><button type="button" aria-label="Aumentar" onClick="{{ mais }}" style="flex: none; width: 44px; height: 44px; border-radius: 12px; border: 0; background: #A9482C; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></button></div></div><div style="display: flex; flex-direction: column; gap: 6px"><label for="motivo" style="font-size: 14px; line-height: 20px; font-weight: 600">Motivo</label><select id="motivo" style="height: 48px; padding: 0 12px; border-radius: 8px; border: 1.5px solid #E4DCCB; background: #FFFFFF; color: #292621; font: 400 16px 'Inter', system-ui, sans-serif"><option>Embalagem danificada</option><option>Vencido</option><option>Estragou</option><option>Outro</option></select></div><div style="padding: 14px 16px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E4DCCB; display: flex; flex-direction: column; gap: 8px; "><div style="display: flex; justify-content: space-between; gap: 12px; color: #5E584E; font-variant-numeric: tabular-nums"><span>Saldo físico</span><span>{{ saldo }}</span></div><div style="display: flex; justify-content: space-between; gap: 12px; color: #5E584E; font-variant-numeric: tabular-nums"><span>Custo da perda</span><span>{{ custo }}</span></div></div></main><div style="margin-top: auto; flex: none; padding: 12px 16px 16px; background: #FFFFFF; border-top: 1px solid #E4DCCB; display: flex; flex-direction: column; gap: 8px"><button type="butto </div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
const fmt = (v) => 'R$ ' + v.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const st = this.state || {};
const q = st.q || 1;
const feito = !!st.feito;
return { editando: !feito, feito: feito, q: q, saldo: '18 → ' + (18 - q) + ' un', custo: fmt(q * 14.2), resumo: q + ' un de Queijo coalho · ' + fmt(q * 14.2) + ' de custo · lote QC-1107',
  menos: () => this.setState({ q: Math.max(1, q - 1) }), mais: () => this.setState({ q: Math.min(8, q + 1) }), registrar: () => this.setState({ feito: true }), desfazer: () => this.setState({ feito: false }) };
}
}
</script>
</body>
