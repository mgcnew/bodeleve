<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Bodeleve — PDV: pagamento combinado</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A9482C}a:hover{color:#8A3920}
</style>
</helmet>
<div style="width: 390px; height: 940px; box-sizing: border-box; display: flex; flex-direction: column; background: #FBFAF6; color: #292621; font-family: 'Inter', system-ui, sans-serif; font-size: 16px; line-height: 24px">
<header style="display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 6px; flex: none; background: #FFFFFF; border-bottom: 1px solid #E4DCCB"><a href="PDV-Pagamento.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; border-radius: 12px; color: #292621; display: inline-flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M15 5l-7 7 7 7"></path></svg></a><div style="flex: 1 1 0; font-family: 'Bricolage Grotesque', 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 20px; line-height: 26px">Dividir pagamento</div></header><main style="flex: 1 1 0; display: flex; flex-direction: column; gap: 16px; padding: 16px 16px 24px"><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><div style="padding: 12px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E4DCCB"><div style="font-size: 12px; line-height: 16px; color: #5E584E">Total</div><div style="font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums">R$ 108,65</div></div><div style="padding: 12px; border-radius: 12px; background: {{ faltaBg }}"><div style="font-size: 12px; line-height: 16px; color: #292621">Falta receber</div><div style="font-weight: 700; font-size: 20px; color: #292621; font-variant-numeric: tabular-nums">{{ falta }}</div></div></div><section style="display: flex; flex-direction: column; gap: 8px"><b>Já recebido</b><div style="padding: 0 16px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E4DCCB"><sc-for list="{{ partes }}" as="pt" hint-placeholder-count="1"><div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #E4DCCB; font-variant-numeric: tabular-nums"><span>{{ pt.forma }}</span><b>{{ pt.valor }}</b></div></sc-for><sc-if value="{{ nenhuma }}" hint-placeholder-val="{{ false }}"><div style="min-height: 52px; display: flex; align-items: center; color: #5E584E">Nada ainda</div></sc-if></div></section><sc-if value="{{ aberto }}" hint-placeholder-val="{{ true }}"><section style="padding: 16px; border-radius: 12px; background: #F4E1D8; display: flex; flex-direction: column; gap: 10px"><b>Próxima parte</b><div role="group" aria-label="Forma" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><button type="button" aria-pressed="{{ z0 }}" onClick="{{ f0 }}" style="flex: 1 1 0; min-width: 0; height: 48px; border-radius: 12px; border: 1.5px solid #292621; background: {{ z0B }}; color: {{ z0C }}; font: 600 16px 'Inter', system-ui, sans-serif; font-variant-numeric: tabular-nums">Dinheiro</button><button type="button" aria-pressed="{{ z1 }}" onClick="{{ f1 }}" style="flex: 1 1 0; min-width: 0; height: 48px; border-radius: 12px; border: 1.5px solid #292621; background: {{ z1B }}; color: {{ z1C }}; font: 600 16px 'Inter', system-ui, sans-serif; font-variant-numeric: tabular-nums">Pix</button><button type="button" aria-pressed="{{ z2 }}" onClick="{{ f2 }}" style="flex: 1 1 0; min-width: 0; height: 48px; border-radius: 12px; border: 1.5px solid #292621; background: {{ z2B }}; color: {{ z2C }}; font: 600 16px 'Inter', system-ui, sans-serif; font-variant-numeric: tabular-nums">Débito</button><button type="button" aria-pressed="{{ z3 }}" onClick="{{ f3 }}" style="flex: 1 1 0; min-width: 0; height: 48px; border-radius: 12px; border: 1.5px solid #292621; background: {{ z3B }}; color: {{ z3C }}; font: 600 16px 'Inter', system-ui, sans-serif; font-variant-numeric: tabular-nums">Crédito</button></div><div style="display: flex; flex-direction: column; gap: 6px"><label for="vp" style="font-size: 14px; line-height: 20px; font-weight: 600">Valor</label><input id="vp" type="text" inputmode="decimal" value="{{ vTxt }}" onChange="{{ onValor }}" style="height: 56px; padding: 0 16px; border-radius: 8px; border: 2px solid #292621; background: #FFFFFF; color: #292621; font: 600 22px 'Inter', system-ui, sans-serif; font-variant-numeric: tabular-nums; box-sizing: border-box; width: 100%"></div><button type="button" onClick="{{ addParte }}" style="height: 48px; border: 0; border-radius: 12px; background: #292621; color: #FFFFFF; font: 600 16px 'Inter', system-ui, sans-serif">Receber esta parte</button></section></sc-if></main><div style="margin-top: auto; flex: none; padding: 12px 16px 16px; background: #FFFFFF; border-top: 1px solid #E4DCCB; display: flex; flex-direction: column; gap: 8px"><sc-if value="{{ quitado }}" hint-placeholder-val="{{ false }}"><a href="PDV-Concluida.dc.html" style="height: 56px; border-radius: 12px; background: #A9482C; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums">Concluir venda</a></sc-if><sc-if value="{{ aberto }}" hint-placeholder-val="{{ true }}"><button type="button" disabled style="height: 56px; border: 0; border-radius: 12px; background: #E4DCCB; color: #5E584E; font: 600 16px 'Inter', system-ui, sans-serif; width: 100%; font-variant-numeric: tabular-nums">Falta {{ falta }}</button></sc-if><button type="button" onClick="{{ reset }}" style="height: 48px; border: 1.5px solid #292621; border-radius: 12px; background: #FFFFFF; color: #292621; font: 600 16px 'Inter', system-ui, sans-serif; width: 100%">Recomeçar</button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":940}}'>
class Component extends DCLogic {
renderVals() {
const fmt = (v) => 'R$ ' + v.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const st = this.state || {};
const F = ['Dinheiro', 'Pix', 'Débito', 'Crédito'];
const parts = st.parts || [{ f: 0, v: 50 }];
const f = st.f === undefined ? 1 : st.f;
const pago = Math.round(parts.reduce((a, b) => a + b.v, 0) * 100) / 100;
const falta = Math.max(0, Math.round((108.65 - pago) * 100) / 100);
const v = st.v === undefined ? falta : st.v;
const out = { partes: parts.map((p) => ({ forma: F[p.f], valor: fmt(p.v) })), nenhuma: parts.length === 0, falta: fmt(falta), faltaBg: falta > 0 ? '#F8EBC9' : '#E3EDE6', aberto: falta > 0, quitado: falta === 0,
  vTxt: v.toFixed(2).replace('.', ','), onValor: (e) => { const n = parseFloat(String(e.target.value).replace(/\./g, '').replace(',', '.')); this.setState({ v: isNaN(n) ? 0 : n }); },
  addParte: () => { const val = Math.min(v, falta); if (val > 0) this.setState({ parts: parts.concat([{ f: f, v: val }]), v: undefined }); }, reset: () => this.setState({ parts: [], v: undefined }) };
[0, 1, 2, 3].forEach((k) => { out['f' + k] = () => this.setState({ f: k }); });
out.z0 = f === 0; out.z0B = (f === 0) ? '#292621' : '#FFFFFF'; out.z0C = (f === 0) ? '#FFFFFF' : '#292621';
out.z1 = f === 1; out.z1B = (f === 1) ? '#292621' : '#FFFFFF'; out.z1C = (f === 1) ? '#FFFFFF' : '#292621';
out.z2 = f === 2; out.z2B = (f === 2) ? '#292621' : '#FFFFFF'; out.z2C = (f === 2) ? '#FFFFFF' : '#292621';
out.z3 = f === 3; out.z3B = (f === 3) ? '#292621' : '#FFFFFF'; out.z3C = (f === 3) ? '#FFFFFF' : '#292621';
return out;
}
}
</script>
</body>
</html>
