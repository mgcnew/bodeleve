 border-radius: 999px; border: 1.5px solid #292621; background: {{ cb0 }}; color: {{ cc0 }}; font: 600 14px 'Inter', system-ui, sans-serif">Laticínios</button><button type="button" aria-pressed="{{ ca1 }}" onClick="{{ cat1 }}" style="height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #292621; background: {{ cb1 }}; color: {{ cc1 }}; font: 600 14px 'Inter', system-ui, sans-serif">Carnes</button><button type="button" aria-pressed="{{ ca2 }}" onClick="{{ cat2 }}" style="height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #292621; background: {{ cb2 }}; color: {{ cc2 }}; font: 600 14px 'Inter', system-ui, sans-serif">Farinhas e grãos</button><button type="button" aria-pressed="{{ ca3 }}" onClick="{{ cat3 }}" style="height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #292621; background: {{ cb3 }}; color: {{ cc3 }}; font: 600 14px 'Inter', system-ui, sans-serif">Doces</button></div></sc-if><sc-if value="{{ isBusca }}" hint-placeholder-val="{{ false }}"><div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border-radius: 999px; background: #FFFFFF; border: 1.5px solid #292621; color: #5E584E"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><input type="search" aria-label="Buscar produto" placeholder="Nome do produto" onChange="{{ onBusca }}" style="flex: 1 1 0; min-width: 0; border: 0; background: transparent; font: 400 16px 'Inter', system-ui, sans-serif; color: #292621; outline: none"></div></sc-if><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><sc-for list="{{ prods }}" as="p" hint-placeholder-count="8"><button type="button" aria-label="{{ p.aria }}" onClick="{{ p.tap }}" style="height: 104px; padding: 12px; border-radius: 12px; border: 1px solid #E4DCCB; background: #FFFFFF; color: #292621; text-align: left; display: flex; flex-direction: column; justify-content: space-between; font: 400 14px 'Inter', system-ui, sans-serif; min-width: 0"><span style="font-weight: 600; font-size: 15px; line-height: 20px">{{ p.nome }}</span><span style="display: flex; justify-content: space-between; align-items: baseline; gap: 4px; font-variant-numeric: tabular-nums"><span style="font-weight: 700; font-size: 16px">{{ p.preco }}</span><span style="font-size: 12px; color: {{ p.cor }}; font-weight: {{ p.peso }}">{{ p.est }}</span></span></button></sc-for></div><sc-if value="{{ vazio }}" hint-placeholder-val="{{ false }}"><div style="font-size: 14px; line-height: 20px; color: #5E584E; text-align: center; padding: 24px 0">Nenhum produto com esse nome.</div></sc-if><div style="font-size: 14px; line-height: 20px; color: #5E584E">Toque para somar 1. Produtos por peso pedem o peso antes.</div></main><div style="flex: none; display: flex; flex-direction: column"><sc-if value="{{ tem }}" hint-placeholder-val="{{ false }}"><a href="PDV-Sacola.dc.html" style="margin: 0 12px 12px; height: 56px; padding: 0 16px; border-radius: 12px; background: #A9482C; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; gap: 12px; font-weight: 600"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M6 8h12l1 12H5L6 8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg><span style="flex: 1 1 0">Sacola · {{ itens }}</span><span style="font-variant-numeric: tabular-nums">{{ total }}</span></a></sc-if><nav aria-label="Navegação do caixa" style="flex: none; display: flex; background: #FFFFFF; border-top: 1px solid #E4DCCB"><a href="PDV-Vender.dc.html" aria-current="page" style="flex: 1 1 0; min-width: 0; height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #A9482C; font-size: 12px; line-height: 16px; font-weight: 700"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M3 12V4h8l10 10-8 8L3 12z"></path><circle cx="7.5" cy="7.5" r="1.2"></circle></svg><span>Vender</span></a><a href="PDV-Vendas.dc.html" style="flex: 1 1 0; min-width: 0; height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5E584E; font-size: 12px; line-height: 16px; font-weight: 500"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg><span>Vendas</span></a><a href="PDV-Caixa.dc.html" style="flex: 1 1 0; min-width: 0; height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5E584E; font-size: 12px; line-height: 16px; font-weight: 500"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M3 6h18v12H3z"></path><circle cx="12" cy="12" r="3"></circle></svg><span>Caixa</span></a></nav></div><sc-if value="{{ sheet }}" hint-placeholder-val="{{ false }}"><div style="position: absolute; inset: 0; background: rgba(41,38,33,0.45); display: flex; flex-direction: column; justify-content: flex-end"><div role="dialog" aria-modal="true" aria-label="Informar peso" style="background: #FFFFFF; border-radius: 20px 20px 0 0; padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 16px"><div aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: #E4DCCB"></div><div><div style="font-family: 'Bricolage Grotesque', 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 22px; line-height: 28px">{{ sNome }}</div><div style="font-size: 14px; line-height: 20px; color: #5E584E; font-variant-numeric: tabular-nums">{{ sPreco }}</div></div><div style="display: flex; align-items: center; justify-content: space-between; gap: 12px"><span id="pl" style="font-weight: 600">Peso</span><div role="group" aria-label="Peso em gramas" style="display: inline-flex; align-items: center; gap: 2px"><button type="button" aria-label="Diminuir" onClick="{{ pMenos }}" style="flex: none; width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E4DCCB; background: #F7F2E8; color: #292621; display: inline-flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M5 12h14"></path></svg></button><div aria-live="polite" style="min-width: 36px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums">{{ sPeso }}</div><button type="button" aria-label="Aumentar" onClick="{{ pMais }}" style="flex: none; width: 44px; height: 44px; border-radius: 12px; border: 0; background: #A9482C; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></button></div></div><div role="group" aria-label="Pesos comuns" style="display: flex; gap: 8px"><button type="button" aria-pressed="{{ k0 }}" onClick="{{ g0 }}" style="flex: 1 1 0; min-width: 0; height: 48px; border-radius: 12px; border: 1.5px solid #292621; background: {{ k0B }}; color: {{ k0C }}; font: 600 16px 'Inter', system-ui, sans-serif; font-variant-numeric: tabular-nums">250 g</button><button type="button" aria-pressed="{{ k1 }}" onClick="{{ g1 }}" style="flex: 1 1 0; min-width: 0; height: 48px; border-radius: 12px; border: 1.5px solid #292621; background: {{ k1B }}; color: {{ k1C }}; font: 600 16px 'Inter', system-ui, sans-serif; font-variant-numeric: tabular-nums">500 g</button><button type="button" aria-pressed="{{ k2 }}" onClick="{{ g2 }}" style="flex: 1 1 0; min-width: 0; height: 48px; border-radius: 12px; border: 1.5px solid #292621; background: {{ k2B }}; color: {{ k2C }}; font: 600 16px 'Inter', system-ui, sans-serif; font-variant-numeric: tabular-nums">1 kg</button></div><button type="button" onClick="{{ addPeso }}" style="height: 56px; border: 0; border-radius: 12px; background: #A9482C; color: #FFFFFF; font: 600 18px 'Inter', system-ui, sans-serif; width: 100%; font-variant-numeric: tabular-nums; ">Adicionar · {{ sTotal }}</button><button type="button" onClick="{{ fechar }}" style="height: 48px; border: 1.5px solid #292621; border-radius: 12px; background: #FFFFFF; color: #292621; font: 600 16px 'Inter', system-ui, sans-serif; width: 100%">Cancelar</button></div></div></sc-if></div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const fmt = (v) => 'R$ ' + v.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const st = this.state || {};
const tab = st.tab || 0;
const cat = st.cat || 0;
const q = (st.q || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const cart = st.cart || [];
const P = [
  { nome: 'Queijo coalho', preco: 32.9, kg: false, est: '12 un', baixo: false, cat: 0 },
  { nome: 'Carne de sol', preco: 59.9, kg: true, est: '6,4 kg', baixo: false, cat: 1 },
  { nome: 'Farinha de mandioca', preco: 12.9, kg: false, est: '26 un', baixo: false, cat: 2 },
  { nome: 'Tapioca granulada', preco: 9.9, kg: false, est: '3 un', baixo: true, cat: 2 },
  { nome: 'Rapadura', preco: 14.5, kg: false, est: '4 un', baixo: true, cat: 3 },
  { nome: 'Manteiga de garrafa', preco: 28, kg: false, est: '11 un', baixo: false, cat: 0 },
  { nome: 'Feijão de corda', preco: 16.9, kg: true, est: '9 kg', baixo: false, cat: 2 },
  { nome: 'Doce de leite', preco: 18.9, kg: false, est: '9 un', baixo: false, cat: 3 }
];
const norm = (s) => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const vis = P.map((p, i) => ({ p: p, i: i })).filter((o) => tab === 0 || (tab === 1 && o.p.cat === cat) || (tab === 2 && (q === '' || norm(o.p.nome).indexOf(q) >= 0)));
const add = (it) => this.setState({ cart: cart.concat([it]) });
const prods = vis.map((o) => ({ nome: o.p.nome, preco: o.p.kg ? fmt(o.p.preco) + '/kg' : fmt(o.p.preco), est: o.p.est, cor: o.p.baixo ? '#7A5A12' : '#5E584E', peso: o.p.baixo ? 700 : 400,
  aria: o.p.nome + ', ' + (o.p.kg ? fmt(o.p.preco) + ' o quilo' : fmt(o.p.preco)) + ', estoque ' + o.p.est,
  tap: () => { if (o.p.kg) { this.setState({ sheet: o.i + 1, g: 500 }); } else { add({ v: o.p.preco }); } } }));
const total = cart.reduce((a, b) => a + b.v, 0);
const n = cart.length;
const sp = st.sheet ? P[st.sheet - 1] : P[1];
const g = st.g || 500;
const out = { prods: prods, vazio: prods.length === 0, isCat: tab === 1, isBusca: tab === 2, tem: n > 0, itens: n + (n === 1 ? ' item' : ' itens'), total: fmt(total),
  sheet: !!st.sheet, sNome: sp.nome, sPreco: fmt(sp.preco) + ' o quilo', sPeso: (g / 1000).toFixed(3).replace('.', ',') + ' kg', sTotal: fmt(sp.preco * g / 1000),
  pMenos: () => this.setState({ g: Math.max(50, g - 50) }), pMais: () => this.setState({ g: g + 50 }), fechar: () => this.setState({ sheet: 0 }),
  addPeso: () => this.setState({ cart: cart.concat([{ v: Math.round(sp.preco * g / 10) / 100 }]), sheet: 0 }),
  g0: () => this.setState({ g: 250 }), g1: () => this.setState({ g: 500 }), g2: () => this.setState({ g: 1000 }),
  onBusca: (e) => this.setState({ q: e.target.value }) };
out.k0 = g === 250; out.k0B = (g === 250) ? '#292621' : '#FFFFFF'; out.k0C = (g === 250) ? '#FFFFFF' : '#292621';
out.k1 = g === 500; out.k1B = (g === 500) ? '#292621' : '#FFFFFF'; out.k1C = (g === 500) ? '#FFFFFF' : '#292621';
out.k2 = g === 1000; out.k2B = (g === 1000) ? '#292621' : '#FFFFFF'; out.k2C = (g === 1000) ? '#FFFFFF' : '#292621';
[0, 1, 2].forEach((k) => { out['ta' + k] = tab === k; out['tb' + k] = tab === k ? '#A9482C' : 'transparent'; out['tc' + k] = tab === k ? '#292621' : '#5E584E'; out['tab' + k] = () => this.setState({ tab: k }); });
[0, 1, 2, 3].forEach((k) => { out['ca' + k] = cat === k; out['cb' + k] = cat === k ? '#292621' : '#FFFFFF'; out['cc' + k] = cat === k ? '#FFFFFF' : '#292621'; out['cat' + k] = () => this.setState({ cat: k }); });
return out;
}
}
</script>
