<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const fmt = (v) => 'R$ ' + v.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const st = this.state || {};
const m = st.m || 0;
const r = st.r === undefined ? 2 : st.r;
const R = [108.65, 110, 120, 150];
const on = '2px solid #292621', off = '1.5px solid #E4DCCB';
const B = ['Recebi ' + fmt(R[r]) + ' · concluir', 'Pix recebido · concluir', 'Cartão aprovado · concluir', 'Cartão aprovado · concluir'];
const out = { din: m === 0, pix: m === 1, cartao: m >= 2, troco: fmt(R[r] - 108.65), btn: B[m] };
[0, 1, 2, 3].forEach((k) => { out['ma' + k] = m === k; out['mb' + k] = m === k ? on : off; out['mt' + k] = () => this.setState({ m: k }); out['r' + k] = () => this.setState({ r: k }); });
out.y0 = r === 0; out.y0B = (r === 0) ? '#292621' : '#FFFFFF'; out.y0C = (r === 0) ? '#FFFFFF' : '#292621';
out.y1 = r === 1; out.y1B = (r === 1) ? '#292621' : '#FFFFFF'; out.y1C = (r === 1) ? '#FFFFFF' : '#292621';
out.y2 = r === 2; out.y2B = (r === 2) ? '#292621' : '#FFFFFF'; out.y2C = (r === 2) ? '#FFFFFF' : '#292621';
out.y3 = r === 3; out.y3B = (r === 3) ? '#292621' : '#FFFFFF'; out.y3C = (r === 3) ? '#FFFFFF' : '#292621';
return out;
}
}
</script>
