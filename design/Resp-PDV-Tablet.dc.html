<div style="width: 1024px; height: 768px; display: flex; background: #FBFAF6; box-sizing: border-box; color: #292621; font-family: 'Inter', system-ui, sans-serif; font-size: 16px; line-height: 24px">
<div style="flex: 1 1 0; display: flex; flex-direction: column; min-width: 0"><header style="display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; background: #FFFFFF; border-bottom: 1px solid #E4DCCB"><div><b style="font-family: 'Bricolage Grotesque', 'Inter', system-ui, sans-serif; font-size: 22px">Balcão</b><span style="font-size: 14px; line-height: 20px; color: #5E584E"> · caixa aberto · Júlia</span></div><div role="tablist" style="display: flex; gap: 4px"><span role="tab" aria-selected="true" style="height: 44px; padding: 0 16px; display: inline-flex; align-items: center; border-bottom: 3px solid #A9482C; font-weight: 600; color: #292621">Favoritos</span><span role="tab" aria-selected="false" style="height: 44px; padding: 0 16px; display: inline-flex; align-items: center; border-bottom: 3px solid transparent; font-weight: 600; color: #5E584E">Categorias</span><span role="tab" aria-selected="false" style="height: 44px; padding: 0 16px; display: inline-flex; align-items: center; border-bottom: 3px solid transparent; font-weight: 600; color: #5E584E">Buscar</span></div></header><main style="flex: 1 1 0; padding: 20px 24px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-content: start"><button type="button" onClick="{{ a0 }}" aria-label="Queijo coalho, R$ 32,90" style="height: 112px; padding: 14px; border-radius: 12px; border: 1px solid #E4DCCB; background: #FFFFFF; color: #292621; text-align: left; display: flex; flex-direction: column; justify-content: space-between; font: 400 14px 'Inter', system-ui, sans-serif; min-width: 0"><span style="font-weight: 600; font-size: 16px; line-height: 20px">Queijo coalho</span><span style="display: flex; justify-content: space-between; font-variant-numeric: tabular-nums"><b>R$ 32,90</b><span style="font-size: 12px; color: #5E584E">12 un</span></span></button><button type="button" onClick="{{ a1 }}" aria-label="Carne de sol, R$ 59,90/kg" style="height: 112px; padding: 14px; border-radius: 12px; border: 1px solid #E4DCCB; background: #FFFFFF; color: #292621; text-align: left; display: flex; flex-direction: column; justify-content: space-between; font: 400 14px 'Inter', system-ui, sans-serif; min-width: 0"><span style="font-weight: 600; font-size: 16px; line-height: 20px">Carne de sol</span><span style="display: flex; justify-content: space-between; font-variant-numeric: tabular-nums"><b>R$ 59,90/kg</b><span style="font-size: 12px; color: #5E584E">6,4 kg</span></span></button><button type="button" onClick="{{ a2 }}" aria-label="Farinha de mandioca, R$ 12,90" style="height: 112px; padding: 14px; border-radius: 12px; border: 1px solid #E4DCCB; background: #FFFFFF; color: #292621; text-align: left; display: flex; flex-direction: column; justify-content: space-between; font: 400 14px 'Inter', system-ui, sans-serif; min-width: 0"><span style="font-weight: 600; font-size: 16px; line-height: 20px">Farinha de mandioca</span><span style="display: flex; justify-content: space-between; font-variant-numeric: tabular-nums"><b>R$ 12,90</b><span style="font-size: 12px; color: #5E584E">26 un</span></span></button><button type="button" onClick="{{ a3 }}" aria-label="Tapioca granulada, R$ 9,90" style="height: 112px; padding: 14px; border-radius: 12px; border: 1px solid #E4DCCB; background: #FFFFFF; color: #292621; text-align: left; display: flex; flex-direction: column; justify-content: space-between; font: 400 14px 'Inter', system-ui, sans-serif; min-width: 0"><span style="font-weight: 600; font-size: 16px; line-height: 20px">Tapioca granulada</span><span style="display: flex; justify-content: space-between; font-variant-numeric: tabular-nums"><b>R$ 9,90</b><span style="font-size: 12px; color: #7A5A12">3 un</span></span></button><button type="button" onClick="{{ a4 }}" aria-label="Rapadura, R$ 14,50" style="height: 112px; padding: 14px; border-radius: 12px; border: 1px solid #E4DCCB; background: #FFFFFF; color: #292621; text-align: left; display: flex; flex-direction: column; justify-content: space-between; font: 400 14px 'Inter', system-ui, sans-serif; min-width: 0"><span style="font-weight: 600; font-size: 16px; line-height: 20px">Rapadura</span><span style="display: flex; justify-content: space-between; font-variant-numeric: tabular-nums"><b>R$ 14,50</b><span style="font-size: 12px; color: #7A5A12">4 un</span></span></button><button type="button" onClick="{{ a5 }}" aria-label="Manteiga de garrafa, R$ 28,00" style="height: 112px; padding: 14px; border-radius: 12px; border: 1px solid #E4DCCB; background: #FFFFFF; color: #292621; text-align: left; display: flex; flex-direction: column; justify-content: space-between; font: 400 14px 'Inter', system-ui, sans-serif; min-width: 0"><span style="font-weight: 600; font-size: 16px; line-height: 20px">Manteiga de garrafa</span><span style="display: flex; justify-content: space-between; font-variant-numeric: tabular-nums"><b>R$ 28,00</b><span style="font-size: 12px; color: #5E584E">11 un</span></span></button><button type="button" onClick="{{ a6 }}" aria-label="Feijão de corda, R$ 16,90/kg" style="height: 112px; padding: 14px; border-radius: 12px; border: 1px solid #E4DCCB; background: #FFFFFF; color: #292621; text-align: left; display: flex; flex-direction: column; justify-content: space-between; font: 400 14px 'Inter', system-ui, sans-serif; min-width: 0"><span style="font-weight: 600; font-size: 16px; line-height: 20px">Feijão de corda</span><span style="display: flex; justify-content: space-between; font-variant-numeric: tabular-nums"><b>R$ 16,90/kg</b><span style="font-size: 12px; color: #5E584E">9 kg</span></span></button><button type="button" onClick="{{ a7 }}" aria-label="Doce de leite, R$ 18,90" style="height: 112px; padding: 14px; border-radius: 12px; border: 1px solid #E4DCCB; background: #FFFFFF; color: #292621; text-align: left; display: flex; flex-direction: column; justify-content: space-between; font: 400 14px 'Inter', system-ui, sans-serif; min-width: 0"><span style="font-weight: 600; font-size: 16px; line-height: 20px">Doce de leite</span><span style="display: flex; justify-content: space-between; font-variant-numeric: tabular-nums"><b>R$ 18,90</b><span style="font-size: 12px; color: #5E584E">9 un</span></span></button></main><div style="font-size: 14px; line-height: 20px; color: #5E584E; padding: 0 24px 16px">Produtos por peso abrem o peso numa janela central. Abas e busca como no celular.</div></div><aside aria-label="Sacola" style="flex: none; width: 340px; display: flex; flex-direction: column; background: #FFFFFF; border-left: 1px solid #E4DCCB"><div style="padding: 20px 20px 8px; font-family: 'Bricolage Grotesque', 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 22px">Sacola</div><div style="flex: 1 1 0; padding: 0 20px; overflow: auto"><sc-for list="{{ itens }}" as="it" hint-placeholder-count="2"><div style="display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid #E4DCCB; font-variant-numeric: tabular-nums"><span>{{ it.n }}</span><b>{{ it.v }}</b></div></sc-for><sc-if value="{{ vazia }}" hint-placeholder-val="{{ false }}"><div style="font-size: 14px; line-height: 20px; color: #5E584E; padding: 12px 0">Toque nos produtos para somar.</div></sc-if></div><div style="padding: 16px 20px 20px; border-top: 1px solid #E4DCCB; display: flex; flex-direction: column; gap: 12px"><div style="display: flex; justify-content: space-between; font-weight: 700; font-size: 24px; font-variant-numeric: tabular-nums"><span>Total</span><span>{{ total }}</span></div><a href="PDV-Pagamento.dc.html" style="height: 56px; border-radius: 12px; background: #A9482C; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 18px">Cobrar</a><button type="button" onClick="{{ limpar }}" style="height: 44px; border: 1.5px solid #292621; border-radius: 12px; background: #FFFFFF; color: #292621; font: 600 15px 'Inter', system-ui, sans-serif">Limpar sacola</button></div></aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":768}}'>
class Component extends DCLogic {
renderVals() {
const fmt = (v) => 'R$ ' + v.toFixed(2).replace('.', ',');
const N = ['Queijo coalho', 'Carne de sol', 'Farinha de mandioca', 'Tapioca granulada', 'Rapadura', 'Manteiga de garrafa', 'Feijão de corda', 'Doce de leite'];
const V = [32.9, 29.95, 12.9, 9.9, 14.5, 28.0, 8.45, 18.9];
const c = (this.state && this.state.c) || [{ i: 0 }, { i: 1 }];
const out = { itens: c.map((x) => ({ n: N[x.i] + (x.i === 1 || x.i === 6 ? ' · 0,500 kg' : ''), v: fmt(V[x.i]) })), vazia: c.length === 0, total: fmt(c.reduce((a, x) => a + V[x.i], 0)), limpar: () => this.setState({ c: [] }) };
N.forEach((n, i) => { out['a' + i] = () => this.setState({ c: c.concat([{ i: i }]) }); });
return out;
}
}
</script>
