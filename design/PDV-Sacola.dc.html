<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":860}}'>
class Component extends DCLogic {
renderVals() {
const fmt = (v) => 'R$ ' + v.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const st = this.state || {};
const P = [32.9, 29.95, 12.9];
const q = st.q || [2, 1, 1];
const d = st.d === undefined ? -1 : st.d;
const pd = st.pd === undefined ? 0 : st.pd;
const sub = q.reduce((a, b, i) => a + b * P[i], 0);
const calc = (k) => k === 0 ? Math.round(sub * 5) / 100 : k === 1 ? Math.round(sub * 10) / 100 : k === 2 ? 5 : Math.round((sub - Math.floor(sub)) * 100) / 100;
const lbl = ['Desconto 5%', 'Desconto 10%', 'Desconto', 'Arredondamento'];
const desc = d >= 0 ? calc(d) : 0;
const chg = (i, s) => () => { const c = q.slice(); c[i] = Math.max(0, c[i] + s); this.setState({ q: c }); };
const out = { sub: fmt(sub), temDesc: d >= 0, descLbl: d >= 0 ? lbl[d] : '', desc: '− ' + fmt(desc), total: fmt(sub - desc), dOpen: !!st.open,
  dAbrir: () => this.setState({ open: true }), dFechar: () => this.setState({ open: false }), aplicar: () => this.setState({ d: pd, open: false }),
  dPrev: 'Desconto de ' + fmt(calc(pd)) + ' · total fica ' + fmt(sub - calc(pd)) };
[0, 1, 2, 3].forEach((k) => { out['d' + k] = () => this.setState({ pd: k }); });
out.x0 = pd === 0; out.x0B = (pd === 0) ? '#292621' : '#FFFFFF'; out.x0C = (pd === 0) ? '#FFFFFF' : '#292621';
out.x1 = pd === 1; out.x1B = (pd === 1) ? '#292621' : '#FFFFFF'; out.x1C = (pd === 1) ? '#FFFFFF' : '#292621';
out.x2 = pd === 2; out.x2B = (pd === 2) ? '#292621' : '#FFFFFF'; out.x2C = (pd === 2) ? '#FFFFFF' : '#292621';
out.x3 = pd === 3; out.x3B = (pd === 3) ? '#292621' : '#FFFFFF'; out.x3C = (pd === 3) ? '#FFFFFF' : '#292621';
q.forEach((v, i) => { out['v' + i] = v > 0; out['q' + i] = v; out['s' + i] = fmt(v * P[i]); out['m' + i] = chg(i, -1); out['p' + i] = chg(i, 1); out['r' + i] = () => { const c = q.slice(); c[i] = 0; this.setState({ q: c }); }; });
return out;
}
}
</script>
